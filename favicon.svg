<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#151b3e"/><stop offset="1" stop-color="#05060d"/>
    </linearGradient>
    <radialGradient id="au" cx="0.5" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#2ce0ff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#2ce0ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fl" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#ffd76a"/><stop offset="1" stop-color="#f9432b"/>
    </linearGradient>
    <linearGradient id="dr" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#7ee8ff"/><stop offset="1" stop-color="#1668d8"/>
    </linearGradient>
    <linearGradient id="rg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#a0f0ff"/><stop offset="1" stop-color="#a04ce0"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <circle cx="256" cy="248" r="196" fill="url(#au)"/>

  <!-- yörünge halkaları -->
  <g fill="none" stroke="url(#rg)" stroke-width="9" opacity="0.85">
    <ellipse cx="256" cy="256" rx="176" ry="176"/>
    <ellipse cx="256" cy="256" rx="176" ry="74" transform="rotate(58 256 256)"/>
    <ellipse cx="256" cy="256" rx="176" ry="74" transform="rotate(-58 256 256)"/>
  </g>

  <!-- merkez: ateş + su birleşimi -->
  <path d="M256 128c46 60 92 86 92 158 0 58-41 104-92 104s-92-46-92-104c0-46 26-72 40-105 13 33 33 40 40 20 7-22-7-46 12-73z"
