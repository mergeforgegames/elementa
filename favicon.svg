  <path d="M256 196c30 42 52 62 52 92a52 52 0 1 1-104 0c0-30 22-50 52-92z"
        fill="url(#dr)" opacity="0.92"/>
  <circle cx="256" cy="300" r="26" fill="#ffffff" opacity="0.9"/>
